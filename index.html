<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MyExpense</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#4CAF50">


<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial;background:#f4f6fb}
.app{max-width:430px;margin:auto;padding:14px;padding-bottom:140px}
header{text-align:center;font-size:22px;font-weight:700;margin-bottom:12px}

/* WALLET */
.wallet{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  border-radius:28px;
  padding:20px;
  position:relative;
  box-shadow:0 20px 40px rgba(34,197,94,.35);
  overflow:hidden;
}

/* soft shine effect */
.wallet::after{
  content:"";
  position:absolute;
  top:-40%;
  right:-40%;
  width:200px;
  height:200px;
  background:rgba(255,255,255,.15);
  border-radius:50%;
}

.wallet h1{
  margin:8px 0;
  font-size:38px;
  font-weight:800;
  letter-spacing:1px;
}

.wallet-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-top:12px;
  background:rgba(255,255,255,.18);
  padding:10px 14px;
  border-radius:16px;
}

.progress{
  background:rgba(255,255,255,.25);
  height:10px;
  border-radius:12px;
  overflow:hidden;
  margin-top:12px;
}

.progress-fill{
  height:100%;
  background:linear-gradient(90deg,#fff,#dcfce7);
  transition:.6s;
}

.wallet-btn{
  position:absolute;
  right:14px;
  background:rgba(255,255,255,.25);
  border:none;
  color:white;
  padding:6px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  backdrop-filter: blur(6px);
  cursor:pointer;
  z-index:2; /* keeps button above effects */
}


/* ACTIONS */
.actions{display:flex;gap:10px;margin-top:14px}
.actions button{flex:1;padding:12px;border-radius:16px;border:none;background:#fff;font-weight:700}

/* CARDS */
.card{background:#fff;border-radius:20px;padding:14px;margin-top:14px}
.quick{
  display:flex;
  gap:12px;              /* more gap */
  flex-wrap:wrap;
  margin-top:10px;       /* space from title */
}

.quick button{
  background:#eef2ff;
  border:none;
  padding:14px 16px;     /* taller buttons */
  border-radius:18px;
  font-weight:600;
  min-width:120px;       /* prevents squeezing */
  text-align:center;
}

.edit-btn{font-size:13px;color:#2563eb;cursor:pointer;margin-left:6px}

/* QUICK SETUP */
.quick-setup input{
  width:100%;padding:12px;margin-top:8px;
  border-radius:14px;border:1px solid #ddd
}

/* HISTORY */
.day-card{background:#f9fafb;border-radius:16px;padding:12px;margin-top:12px}
.day-title{font-weight:700;margin-bottom:6px}
.expense{display:flex;justify-content:space-between;font-size:14px;margin-top:6px}
.del{
  background:#ef4444;color:white;border:none;
  border-radius:6px;padding:2px 6px;
  font-size:12px;margin-left:6px;cursor:pointer;
}

/* FAB */
.fab{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:#4CAF50;color:white;border:none;
  padding:14px 26px;border-radius:30px;font-size:16px;font-weight:700
}

/* SHEET */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:1000}
.sheet-box{background:white;width:100%;padding:20px;border-radius:28px 28px 0 0}
.sheet-box input,.sheet-box select{
  width:100%;padding:14px;margin-top:12px;border-radius:16px;border:1px solid #ddd
}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions button{flex:1;padding:14px;border-radius:18px;border:none;font-weight:700}
.save{background:#4CAF50;color:white}
.cancel{background:#e5e7eb}

/* MODALS */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:2000}
.modal-box{background:white;width:80%;max-width:320px;padding:20px;border-radius:22px;text-align:center}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions button{flex:1;padding:12px;border-radius:14px;border:none;font-weight:700}
.danger{background:#ef4444;color:white}

/* QUICK SETUP – UPGRADED */
.quick-setup{
  background:linear-gradient(135deg,#f8fafc,#eef2ff);
  border:1px solid #e5e7eb;
}

.qs-header{
  font-weight:700;
  font-size:16px;
  margin-bottom:10px;
}

.qs-header small{
  display:block;
  font-weight:500;
  font-size:12px;
  color:#6b7280;
  margin-top:2px;
}

.quick-setup input{
  background:white;
  border:1px solid #dbeafe;
}

.quick-setup input:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 2px rgba(37,99,235,.15);
}

.quick-setup .save{
  margin-top:14px;
  background:#2563eb;
  border-radius:16px;
  font-size:15px;
}

.modal-box{
  max-height:80vh;           /* fits mobile screen */
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
#quickEditList{
  overflow-y:auto;
  max-height:45vh;           /* scroll area */
  padding-right:4px;
}
#quickEditList input{
  padding:10px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:14px;
}

/* name field = big */
#quickEditList input[type="text"]{
  flex:1;
}

/* amount field = small */
#quickEditList input[type="number"]{
  width:90px;
  text-align:right;
}


</style>
</head>

<body>

<div class="app">
<header>💰 MyExpense</header>

<div class="wallet">
<button class="wallet-btn" style="top:14px" onclick="openBalanceModal()">➕ Add</button>
<button class="wallet-btn" style="top:52px" onclick="openEditBalance()">✏️ Edit</button>
  <small>Current Balance</small>
  <h1>₹<span id="currentBalance">0</span></h1>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  <div class="wallet-row">
    <span>Total ₹<span id="totalBalance">0</span></span>
    <span>Spent ₹<span id="totalSpent">0</span></span>
  </div>
</div>

<div class="actions">
  <button onclick="exportExcel()">⬇ Excel</button>
  <button onclick="openClear()">🧹 Clear</button>
</div>

<!-- QUICK SETUP -->
<div class="card quick-setup" id="quickSetup">
  <div class="qs-header">
    ⚡ Quick Expense Setup
    <small>Tap once to add common expenses</small>
  </div>

  <div style="display:flex;gap:8px">
    <input id="q1n" placeholder="Food">
    <input id="q1a" type="number" placeholder="₹">
  </div>

  <div style="display:flex;gap:8px">
    <input id="q2n" placeholder="Travel">
    <input id="q2a" type="number" placeholder="₹">
  </div>

  <div style="display:flex;gap:8px">
    <input id="q3n" placeholder="Shopping">
    <input id="q3a" type="number" placeholder="₹">
  </div>

  <button class="save" onclick="saveQuick()">Save</button>
</div>

<!-- QUICK EXPENSE BUTTONS -->
<div class="card">
  <strong>
  ⚡ Quick Expenses
  <span class="edit-btn" onclick="openQuickEdit()">Edit</span>
</strong>
<div class="quick" id="quickBox"></div>
</div>

<!-- EDIT QUICK EXPENSES -->
<div class="modal" id="editQuickModal">
  <div class="modal-box">
    <strong>Edit Quick Expenses</strong>

<div id="quickEditList" style="margin-top:12px;flex:1"></div>


    <div class="modal-actions">
      <button onclick="closeQuickEdit()">Cancel</button>
      <button class="save" onclick="saveQuickEdit()">Save</button>
    </div>
  </div>
</div>



<!-- PIE CHART -->
<div class="card">
  <strong>📊 Category Split</strong>
  <select id="pieFilter" onchange="drawPie()" style="width:100%;margin:10px 0;padding:10px;border-radius:12px">
    <option value="today">Today</option>
    <option value="week">Weekly</option>
    <option value="month">Monthly</option>
    <option value="year">Yearly</option>
  </select>
  <canvas id="pieCanvas"></canvas>
</div>

<div class="card" id="insightsCard">
  <strong>🧠 Spending Insights</strong>
  <div id="insights" style="margin-top:10px;font-size:14px"></div>
</div>


<div class="card">
  <strong>🧾 Expense History</strong>
  <div id="list"></div>
</div>
</div>

<button class="fab" onclick="openSheet()">➕ Add Expense</button>

<!-- ADD EXPENSE -->
<div class="sheet" id="sheet">
  <div class="sheet-box">
    <input type="number" id="amount" placeholder="Amount ₹">
  <select id="category" onchange="toggleCustomCategory()">
  <option>Metro</option>
  <option>Auto</option>
  <option>Bus</option>
  <option>Car</option>
  <option>Train</option>
  <option>Flights</option>
  <option>Grocery</option>
  <option>Shopping</option>
  <option>Food</option>
  <option>Medical</option>
  <option value="Other">Other</option>
</select>

<input
  type="text"
  id="customCategory"
  placeholder="Enter expense name (Movie, Party, etc)"
  style="display:none"
/>

    <input type="date" id="date">
    <div class="sheet-actions">
      <button class="cancel" onclick="closeSheet()">Cancel</button>
      <button class="save" onclick="addExpense()">Save</button>
    </div>
  </div>
</div>

<!-- BALANCE -->
<div class="modal" id="balanceModal">
  <div class="modal-box">
    <strong>Add Balance</strong>
    <input type="number" id="balanceInput" placeholder="Amount ₹">
    <div class="modal-actions">
      <button onclick="closeBalance()">Cancel</button>
      <button class="save" onclick="saveBalance()">Add</button>
    </div>
  </div>
</div>

<!-- EDIT BALANCE -->
<div class="modal" id="editBalanceModal">
  <div class="modal-box">
    <strong>Edit Balance</strong>
    <input type="number" id="editBalanceInput" placeholder="Enter correct balance ₹">

    <div class="modal-actions">
      <button onclick="closeEditBalance()">Cancel</button>
      <button class="save" onclick="saveEditedBalance()">Update</button>
    </div>
  </div>
</div>


<!-- CLEAR -->
<div class="modal" id="clearModal">
  <div class="modal-box">
    <strong>Clear all data?</strong>
    <div class="modal-actions">
      <button onclick="closeClear()">Cancel</button>
      <button class="danger" onclick="confirmClear()">Yes</button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM -->
<div class="modal" id="deleteModal">
  <div class="modal-box">
    <strong>Delete this expense?</strong>
    <p style="font-size:13px;color:#6b7280;margin-top:6px">
      This action cannot be undone
    </p>
    <div class="modal-actions">
      <button onclick="closeDelete()">Cancel</button>
      <button class="danger" onclick="confirmDeleteYes()">Delete</button>
    </div>
  </div>
</div>

<div id="toast" style="
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#16a34a;
  color:white;
  padding:14px 24px;
  border-radius:18px;
  font-weight:600;
  font-size:15px;
  display:none;
  z-index:3000;
  box-shadow:0 15px 30px rgba(0,0,0,.2);
"></div>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
const categoryIcons = {
  metro:"🚇", auto:"🛺", bus:"🚌", car:"🚗", train:"🚆", flights:"✈️",
  grocery:"🛒", shopping:"🛍️", food:"🍔", medical:"🏥"
};

let expenses = readJSON("expenses", []);
let totalBalance = Number(localStorage.getItem("totalBalance")) || 0;
let quickExpenses = readJSON("quickExpenses", []);
let quickConfigured = localStorage.getItem("quickConfigured") === "true";
let pieChart = null;
let deleteDate = null;
let deleteIndex = null;

function readJSON(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value ?? fallback;
  } catch {
    return fallback;
  }
}
function todayLocal() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
$("date").value = todayLocal();

function persistExpenses() {
  localStorage.setItem("expenses", JSON.stringify(expenses));
}
function money(value) {
  return Number(value || 0).toLocaleString("en-IN", {maximumFractionDigits:2});
}
function showToast(message) {
  const toast = $("toast");
  toast.textContent = message;
  toast.style.background = "#2563eb";
  toast.style.display = "block";
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.style.display = "none", 2200);
}
function saveQuick() {
  quickExpenses = [1,2,3].map(i => ({
    name: $(`q${i}n`).value.trim(),
    amt: Number($(`q${i}a`).value)
  })).filter(q => q.name && Number.isFinite(q.amt) && q.amt > 0);
  localStorage.setItem("quickExpenses", JSON.stringify(quickExpenses));
  localStorage.setItem("quickConfigured", "true");
  quickConfigured = true;
  renderQuick();
  showToast("Quick expenses saved");
}
function renderQuick() {
  const box = $("quickBox");
  box.replaceChildren();
  $("quickSetup").style.display = quickConfigured ? "none" : "block";
  if (!quickConfigured) return;
  quickExpenses.forEach(q => {
    const button = document.createElement("button");
    button.textContent = `${categoryIcons[q.name.toLowerCase()] || "⚡"} ${q.name} ₹${money(q.amt)}`;
    button.addEventListener("click", () => {
      expenses.push({id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()), amount:q.amt, category:q.name, date:$("date").value || todayLocal()});
      persistExpenses();
      render();
      showToast(`${q.name} ₹${money(q.amt)} added`);
    });
    box.appendChild(button);
  });
}
function render() {
  const list = $("list");
  list.replaceChildren();
  const groups = {};
  let spent = 0;
  expenses.forEach(e => {
    e.amount = Number(e.amount) || 0;
    spent += e.amount;
    (groups[e.date] ||= []).push(e);
  });
  Object.keys(groups).sort((a,b) => b.localeCompare(a)).forEach(day => {
    const card = document.createElement("div");
    card.className = "day-card";
    const title = document.createElement("div");
    title.className = "day-title";
    title.textContent = `🗓️ ${day}`;
    card.appendChild(title);
    groups[day].forEach(e => {
      const row = document.createElement("div");
      row.className = "expense";
      const name = document.createElement("span");
      name.textContent = `${categoryIcons[String(e.category).toLowerCase()] || "💸"} ${e.category}`;
      const right = document.createElement("span");
      right.append(`₹${money(e.amount)} `);
      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "✕";
      del.setAttribute("aria-label", `Delete ${e.category}`);
      del.addEventListener("click", () => openDelete(day, expenses.filter(x => x.date === day).indexOf(e)));
      right.appendChild(del);
      row.append(name, right);
      card.appendChild(row);
    });
    list.appendChild(card);
  });
  $("totalBalance").textContent = money(totalBalance);
  $("totalSpent").textContent = money(spent);
  $("currentBalance").textContent = money(totalBalance - spent);
  $("progressFill").style.width = `${totalBalance > 0 ? Math.min(spent / totalBalance * 100, 100) : 0}%`;
  drawPie();
  generateInsights();
}
function isSameWeek(dateA, dateB) {
  const startOfWeek = d => {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay()+6)%7));
    x.setHours(0,0,0,0);
    return x;
  };
  return startOfWeek(dateA).getTime() === startOfWeek(dateB).getTime();
}
function parseLocalDate(value) {
  const [y,m,d] = String(value).split("-").map(Number);
  return new Date(y, (m || 1)-1, d || 1);
}
function drawPie() {
  const canvas = $("pieCanvas");
  if (!canvas || typeof Chart === "undefined") return;
  const filter = $("pieFilter").value;
  const now = new Date();
  const data = {};
  expenses.forEach(e => {
    const d = parseLocalDate(e.date);
    let include = false;
    if (filter === "today") include = e.date === todayLocal();
    if (filter === "week") include = isSameWeek(d, now);
    if (filter === "month") include = d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    if (filter === "year") include = d.getFullYear() === now.getFullYear();
    if (include) data[e.category] = (data[e.category] || 0) + Number(e.amount || 0);
  });
  if (pieChart) pieChart.destroy();
  pieChart = new Chart(canvas, {
    type:"pie",
    data:{labels:Object.keys(data), datasets:[{data:Object.values(data)}]},
    options:{responsive:true, plugins:{legend:{position:"bottom"}}}
  });
}
function addExpense() {
  const amount = Number($("amount").value);
  const date = $("date").value;
  const selected = $("category").value;
  const custom = $("customCategory").value.trim();
  const category = selected === "Other" ? custom : selected;
  if (!Number.isFinite(amount) || amount <= 0) return showToast("Enter a valid amount");
  if (!date) return showToast("Please choose a date");
  if (!category) return showToast("Enter an expense category");
  expenses.push({id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()), amount, category, date});
  persistExpenses();
  $("amount").value = "";
  $("customCategory").value = "";
  $("customCategory").style.display = "none";
  $("category").value = "Metro";
  closeSheet();
  render();
  showToast(`${category} added`);
}
function exportExcel() {
  const quote = value => `"${String(value ?? "").replace(/"/g,'""')}"`;
  const rows = [["Date","Category","Amount"], ...expenses.map(e => [e.date,e.category,e.amount])];
  const csv = "\uFEFF" + rows.map(row => row.map(quote).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8;"}));
  const a = document.createElement("a");
  a.href = url; a.download = "MyExpense.csv"; a.click();
  URL.revokeObjectURL(url);
}
function openSheet(){ $("sheet").style.display = "flex"; }
function closeSheet(){ $("sheet").style.display = "none"; }
function openBalanceModal(){ $("balanceModal").style.display = "flex"; }
function closeBalance(){ $("balanceModal").style.display = "none"; $("balanceInput").value = ""; }
function saveBalance(){
  const amount = Number($("balanceInput").value);
  if (!Number.isFinite(amount) || amount <= 0) return showToast("Enter a valid balance");
  totalBalance += amount;
  localStorage.setItem("totalBalance", String(totalBalance));
  closeBalance(); render(); showToast(`Balance ₹${money(amount)} added`);
}
function openEditBalance(){ $("editBalanceInput").value = totalBalance; $("editBalanceModal").style.display = "flex"; }
function closeEditBalance(){ $("editBalanceModal").style.display = "none"; }
function saveEditedBalance(){
  const amount = Number($("editBalanceInput").value);
  if (!Number.isFinite(amount) || amount < 0) return showToast("Balance cannot be negative");
  totalBalance = amount;
  localStorage.setItem("totalBalance", String(totalBalance));
  closeEditBalance(); render(); showToast("Balance updated");
}
function openClear(){ $("clearModal").style.display = "flex"; }
function closeClear(){ $("clearModal").style.display = "none"; }
function confirmClear(){
  expenses = []; totalBalance = 0; quickExpenses = []; quickConfigured = false;
  ["expenses","totalBalance","quickExpenses","quickConfigured"].forEach(k => localStorage.removeItem(k));
  closeClear(); renderQuick(); render(); showToast("All data cleared");
}
function openDelete(date,index){ deleteDate = date; deleteIndex = index; $("deleteModal").style.display = "flex"; }
function closeDelete(){ $("deleteModal").style.display = "none"; deleteDate = null; deleteIndex = null; }
function confirmDeleteYes(){
  if (deleteDate !== null && deleteIndex !== null) {
    let index = -1;
    expenses = expenses.filter(e => {
      if (e.date !== deleteDate) return true;
      index++;
      return index !== deleteIndex;
    });
    persistExpenses(); render();
  }
  closeDelete(); showToast("Expense deleted");
}
function toggleCustomCategory(){
  const custom = $("customCategory");
  const show = $("category").value === "Other";
  custom.style.display = show ? "block" : "none";
  if (show) custom.focus(); else custom.value = "";
}
function openQuickEdit(){
  const box = $("quickEditList"); box.replaceChildren();
  const items = [...quickExpenses];
  while (items.length < 3) items.push([{name:"Food",amt:""},{name:"Travel",amt:""},{name:"Others",amt:""}][items.length]);
  items.slice(0,3).forEach((q,i) => {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:8px;margin-bottom:8px;align-items:center";
    const amount = document.createElement("input");
    amount.type = "number"; amount.min = "0"; amount.id = `qe-amt-${i}`;
    amount.value = q.amt ?? ""; amount.placeholder = "Amt";
    const name = document.createElement("input");
    name.type = "text"; name.id = `qe-name-${i}`;
    name.value = q.name ?? ""; name.placeholder = "Name";
    row.append(amount,name); box.appendChild(row);
  });
  $("editQuickModal").style.display = "flex";
}
function closeQuickEdit(){ $("editQuickModal").style.display = "none"; }
function saveQuickEdit(){
  const updated = [];
  for(let i=0;i<3;i++){
    const name = $(`qe-name-${i}`).value.trim();
    const amt = Number($(`qe-amt-${i}`).value);
    if(name && Number.isFinite(amt) && amt > 0) updated.push({name,amt});
  }
  quickExpenses = updated;
  quickConfigured = true;
  localStorage.setItem("quickExpenses",JSON.stringify(quickExpenses));
  localStorage.setItem("quickConfigured","true");
  closeQuickEdit(); renderQuick(); showToast("Quick expenses updated");
}
function generateInsights(){
  const box = $("insights");
  if (!expenses.length) { box.textContent = "No expenses yet 👀"; return; }
  let total = 0; const catTotal = {};
  expenses.forEach(e => { total += Number(e.amount)||0; catTotal[e.category] = (catTotal[e.category]||0)+(Number(e.amount)||0); });
  const maxCat = Object.keys(catTotal).reduce((a,b) => catTotal[a] > catTotal[b] ? a : b);
  const todaySpent = expenses.filter(e => e.date === todayLocal()).reduce((sum,e)=>sum+(Number(e.amount)||0),0);
  box.replaceChildren();
  const p = document.createElement("p");
  p.textContent = `🔥 You spent most on ${categoryIcons[maxCat.toLowerCase()] || "💸"} ${maxCat}`;
  const p2 = document.createElement("p"); p2.textContent = `📊 Total spent: ₹${money(total)}`;
  const p3 = document.createElement("p"); p3.textContent = `📅 Today spent: ₹${money(todaySpent)}`;
  box.append(p,p2,p3);
  if(total > totalBalance){ const warning = document.createElement("p"); warning.textContent = "⚠️ You are overspending!"; box.appendChild(warning); }
}

renderQuick();
render();
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
